
name: orbis-commerce

services:
  postgres:
    image: postgres:17
    container_name: orbis-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: orbis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_DB: orbis_catalog

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbis -d orbis_catalog"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orbis-redis
    restart: unless-stopped

    ports:
      - "127.0.0.1:6379:6379"

    command: ["redis-server", "--appendonly", "yes"]

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: orbis-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: orbis
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD}

    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  catalog-api:
    build:
      context: ./src/Services/Catalog/Orbis.Catalog.Api
      dockerfile: Dockerfile

    image: orbis-catalog-api:1.0
    container_name: orbis-catalog-api

    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080

      ConnectionStrings__CatalogDb: "Host=postgres;Port=5432;Database=orbis_catalog;Username=orbis;Password=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}"

    ports:
      - "127.0.0.1:5080:8080"

    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
